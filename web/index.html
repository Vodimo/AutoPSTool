<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoPSTool 刀模排版</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="/lib/clipper.js"></script>
</head>
<body>
  <header>
    <h1>AutoPSTool</h1>
    <input type="file" id="file" accept="image/png,image/jpeg" style="display:none" multiple>
    <button id="btn-import">导入图片</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px">白边
      <input type="range" id="border-range" min="0" max="100" step="1" value="20">
      <input type="number" id="border-num" min="0" step="0.1" value="2" style="width:56px">
      <select id="border-unit"><option value="mm">mm</option><option value="px">px</option></select>
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px">纸张
      <select id="page-preset">
        <option value="A4">A4</option>
        <option value="A3">A3</option>
        <option value="A5">A5</option>
        <option value="Letter">Letter</option>
        <option value="custom">自定义</option>
      </select>
      <input type="number" id="page-w" value="210" min="1" style="width:56px">×
      <input type="number" id="page-h" value="297" min="1" style="width:56px">
      <select id="page-unit"><option value="mm">mm</option><option value="px">px</option></select>
    </label>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px">出血
      <input type="number" id="bleed-num" min="0" step="0.1" value="1.5" style="width:52px">
      <select id="bleed-unit"><option value="mm">mm</option><option value="px">px</option></select>
    </label>
    <button id="btn-brush">修补</button>
    <select id="brush-mode" style="font-size:13px"><option value="add">加</option><option value="erase">擦</option></select>
    <label style="display:flex;align-items:center;gap:4px;font-size:13px">笔刷
      <input type="range" id="brush-size" min="4" max="120" value="24" style="width:72px">
      <span id="brush-size-label" style="width:28px;text-align:right">24</span>px
    </label>
    <button id="btn-cut">切割模式</button>
    <button id="btn-tidy">整理排版</button>
    <button id="btn-fit">适应视图</button>
    <button id="btn-delete">删除选中</button>
    <button id="btn-export">导出 PNG</button>
    <span id="status">就绪</span>
  </header>
  <div id="progress" style="display:none;height:3px;background:#e2e8f0">
    <div id="progress-bar" style="height:100%;width:30%;background:#ec4899;transition:width .2s"></div>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
  </div>
  <script src="/app.js"></script>
</body>
</html>
